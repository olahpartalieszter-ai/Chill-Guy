<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raserants - Chill Zóna</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div class="hatter-kollazs"></div>
    <div class="sotetito-reteg" id="sotetito"></div>
    <div class="tartalom">
        <h1 class="focim">Chill Guy</h1>
        <button class="neon-gomb" id="neKattintsGomb">NE KATTINTS RÁ!</button>
        <div class="stressz-doboz">
            <p>Mennyire stresszelsz?</p>
            <input type="range" min="0" max="100" value="0" class="csuszka" id="stresszCsuszka">
            <p class="csuszka-szoveg" id="csuszkaSzoveg">Chillllll.....</p>
        </div>
        <div class="aranykopes-doboz">
            <h3>Aranymondások</h3>
            <p id="aranykopesSzoveg">"Tanár úr, a sportreferens az ilyen betegség?"</p>
            <button class="kov-gomb" id="ujAranykopesGomb">Következő aranyköpés</button>
        </div>
    </div>
    <div class="popup-hatter" id="popupHatter">
        <div class="popup-doboz">
            <span class="bezar-gomb" id="bezarGomb">&times;</span>
            <h2 id="popupCim">Chill Guy! Mondtam, hogy ne kattints!</h2>
            <img src="" alt="Mém" id="memKep" class="mem-kep">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
